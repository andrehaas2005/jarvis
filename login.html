<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - Login</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/brand/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/brand/favicon-16.png">
    <link rel="apple-touch-icon" sizes="128x128" href="assets/brand/favicon-128.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="login.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-topbar">
        <div class="topbar-brand">
            <span class="topbar-brand-chevron">&gt;_</span>
            <span class="topbar-brand-name">JARVIS</span>
            <span class="topbar-brand-sub">HUD SYSTEM</span>
        </div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <!-- Logo: engrenagem + perfil digital (mesma arte do favicon), fornecida pelo usuário -->
            <div class="login-logo">
                <img src="assets/brand/jarvis-logo.png" alt="JARVIS" class="login-logo-img">
            </div>

            <h1 class="login-title">J.A.R.V.I.S.</h1>
            <div class="login-subtitle">HUD SYSTEM</div>
            <div class="login-tagline">A.I. ASSISTANCE</div>

            <div class="login-status">
                <span class="status-dot-pill"></span>
                <span>JARVIS ONLINE</span>
            </div>

            <form class="login-form" id="loginForm" autocomplete="on">
                <input type="text" id="loginUsername" class="login-input" placeholder="USERNAME" autocomplete="username" required>
                <input type="password" id="loginPassword" class="login-input" placeholder="PASSWORD" autocomplete="current-password" required>
                <div class="login-error" id="loginError" hidden></div>
                <button type="submit" class="login-button" id="loginButton">LOGIN</button>
            </form>
        </div>
    </div>

    <!-- Links de Termos/Privacidade (SCRUM-62) — exigidos pelo Google pra publicar a tela de
         consentimento OAuth em produção (Testing -> Production): o verificador procura por eles
         a partir da página pública do app, que é esta (index.html redireciona pra cá sem login). -->
    <div class="login-legal-footer">
        <a href="terms.html">Termos de Uso</a>
        <span>&middot;</span>
        <a href="privacy.html">Política de Privacidade</a>
    </div>

    <script src="login.js"></script>
</body>
</html>
