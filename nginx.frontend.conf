# Config customizada pro HUD (frontend) — substitui o nginx.conf default da
# imagem base (nginx:alpine). Achado real em produção: o navegador do
# usuário ficou 4h servindo um script.js antigo mesmo depois de um deploy
# novo — a Cloudflare (na frente do jarvis-hud.andre.haas.nom.br) aplica
# "Browser Cache TTL" por tipo de arquivo quando a origem não manda um
# Cache-Control explícito, e 4h é tempo de sobra pra um usuário achar que um
# bug foi corrigido (deploy feito) quando na real só o HTML/CSS atualizou e
# o JS continuou o de antes.
#
# `no-cache` (não `no-store`): o navegador/Cloudflare ainda guardam uma
# cópia, mas são obrigados a revalidar com o servidor (via ETag/If-None-Match)
# antes de reusar — decisão consciente de manter o bônus de banda de um 304
# sem o risco de servir JS desatualizado depois de um deploy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
